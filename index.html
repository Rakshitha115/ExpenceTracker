```html
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Expense Tracker</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f4f6f9;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .container {
      width: 400px;
      background: white;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.1);
    }

    h1 {
      text-align: center;
      margin-bottom: 20px;
      color: #333;
    }

    .balance {
      text-align: center;
      margin-bottom: 20px;
    }

    .balance h2 {
      color: #2e7d32;
      margin-top: 5px;
    }

    .summary {
      display: flex;
      justify-content: space-between;
      background: #f1f1f1;
      padding: 15px;
      border-radius: 10px;
      margin-bottom: 20px;
    }

    .summary div {
      text-align: center;
      width: 45%;
    }

    .income {
      color: green;
    }

    .expense {
      color: red;
    }

    form input,
    form button {
      width: 100%;
      padding: 12px;
      margin: 10px 0;
      border-radius: 8px;
      border: 1px solid #ccc;
    }

    form button {
      background: #1976d2;
      color: white;
      border: none;
      cursor: pointer;
      font-size: 16px;
    }

    form button:hover {
      background: #125aa0;
    }

    ul {
      list-style: none;
      margin-top: 20px;
    }

    li {
      background: #fafafa;
      padding: 12px;
      margin-bottom: 10px;
      border-right: 5px solid;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-radius: 6px;
    }

    li.income-item {
      border-color: green;
    }

    li.expense-item {
      border-color: red;
    }

    .delete-btn {
      background: red;
      color: white;
      border: none;
      padding: 5px 8px;
      border-radius: 5px;
      cursor: pointer;
    }

    .delete-btn:hover {
      background: darkred;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Expense Tracker</h1>

    <div class="balance">
      <h3>Your Balance</h3>
      <h2 id="balance">₹0.00</h2>
    </div>

    <div class="summary">
      <div>
        <h4>Income</h4>
        <p class="income" id="income">₹0.00</p>
      </div>

      <div>
        <h4>Expense</h4>
        <p class="expense" id="expense">₹0.00</p>
      </div>
    </div>

    <form id="expense-form">
      <input type="text" id="text" placeholder="Enter description" required />
      <input type="number" id="amount" placeholder="Enter amount (+ income, - expense)" required />
      <button type="submit">Add Transaction</button>
    </form>

    <ul id="list"></ul>
  </div>

  <script>
    const form = document.getElementById("expense-form");
    const text = document.getElementById("text");
    const amount = document.getElementById("amount");

    const balance = document.getElementById("balance");
    const income = document.getElementById("income");
    const expense = document.getElementById("expense");
    const list = document.getElementById("list");

    let transactions = [];

    function updateValues() {
      const amounts = transactions.map(t => t.amount);

      const total = amounts.reduce((acc, item) => acc + item, 0).toFixed(2);

      const incomeTotal = amounts
        .filter(item => item > 0)
        .reduce((acc, item) => acc + item, 0)
        .toFixed(2);

      const expenseTotal = (
        amounts
          .filter(item => item < 0)
          .reduce((acc, item) => acc + item, 0) * -1
      ).toFixed(2);

      balance.innerText = `₹${total}`;
      income.innerText = `₹${incomeTotal}`;
      expense.innerText = `₹${expenseTotal}`;
    }

    function addTransactionDOM(transaction) {
      const li = document.createElement("li");

      li.classList.add(
        transaction.amount > 0 ? "income-item" : "expense-item"
      );

      li.innerHTML = `
        ${transaction.text} 
        <span>
          ₹${transaction.amount}
          <button class="delete-btn" onclick="removeTransaction(${transaction.id})">
            X
          </button>
        </span>
      `;

      list.appendChild(li);
    }

    function addTransaction(e) {
      e.preventDefault();

      if (text.value.trim() === "" || amount.value.trim() === "") {
        alert("Please enter description and amount");
        return;
      }

      const transaction = {
        id: Date.now(),
        text: text.value,
        amount: +amount.value
      };

      transactions.push(transaction);

      addTransactionDOM(transaction);
      updateValues();

      text.value = "";
      amount.value = "";
    }

    function removeTransaction(id) {
      transactions = transactions.filter(t => t.id !== id);

      init();
    }

    function init() {
      list.innerHTML = "";

      transactions.forEach(addTransactionDOM);

      updateValues();
    }

    form.addEventListener("submit", addTransaction);

    init();
  </script>

</body>
</html>
